# Desarrollo local del backend NestJS con hot-reload.
#   docker compose up --build
# Requiere un archivo .env en esta carpeta (se genera desde .env.example).
services:
  ms:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: onesiteapp_ex-ms:dev
    container_name: onesiteapp_ex-ms
    env_file:
      - .env
    ports:
      # El puerto interno y externo lo fija PORT en el .env (default 3000).
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      # Solo se montan src/ y test/: node_modules se queda con el del contenedor.
      - ./src:/app/src
      - ./test:/app/test
      # Almacen de multimedia (MULTIMEDIA_RUTA_RAIZ) persistido en un volumen.
      - multimedia:/var/datos/onesiteapp/multimedia
    extra_hosts:
      # Permite que DB_HOST=host.docker.internal alcance servicios en el host
      # (SQL Server, NATS, API de catalogos) desde dentro del contenedor.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  multimedia:
