name: "DevSecOps Security Scan - FUNDEA"
on:
  pull_request:
    branches: [ "develop", "production", "certification" ]
  push:
    branches: [ "develop", "production", "certification" ]
  workflow_call:
# NO SE PUBLICA EN GITHUB CODE SCANNING (pestaña Security), a propósito.
#
# La API de Code Scanning es gratuita en repositorios públicos, pero este repo es
# privado y ahí exige GitHub Advanced Security, un producto de pago. Sin esa
# licencia el paso de subida del SARIF falla con "Advanced Security must be enabled
# for this repository" y tumba el job entero sin aportar nada.
#
# Los hallazgos se entregan por dos vías que no dependen de esa licencia:
#   - el resumen del job (GITHUB_STEP_SUMMARY), legible en la propia ejecución;
#   - el artifact `semgrep-sast-results`, con el JSON completo.
#
# Lo que bloquea la fusión es el paso final "Fallar el job...", que depende de
# `semgrep --error` y nunca dependió de la subida. Si algún día se contrata Advanced
# Security, hay que recuperar el paso `upload-sarif`, el paso que genera el SARIF y
# los permisos `security-events: write` y `actions: read`, retirados junto con ellos.
permissions:
  contents: read
jobs:
  sast-scan:
    name: "Análisis Estático de Código (SAST)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código Fuente
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: pip install --no-cache-dir semgrep

      - name: Ejecutar Escaneo SAST (JSON)
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config=auto \
            --json --output=semgrep-results.json \
            --exclude="onesiteapp_ex-ms/dist" \
            --exclude="onesiteapp_ex/build" \
            --error

      - name: Mostrar resumen legible en el log
        if: always()
        run: |
          echo "## Hallazgos Semgrep" >> $GITHUB_STEP_SUMMARY
          jq -r '.results[] | "- **\(.check_id)** en `\(.path):\(.start.line)` — \(.extra.message)"' \
            semgrep-results.json >> $GITHUB_STEP_SUMMARY

      - name: Publicar resultados SAST (JSON)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: semgrep-sast-results
          path: semgrep-results.json

      - name: Fallar el job si hubo findings bloqueantes
        if: steps.semgrep.outcome == 'failure'
        run: exit 1

  sca-scan:
    name: "Análisis de Dependencias Terceras (SCA)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código Fuente
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Ejecutar Escaneo SCA (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
