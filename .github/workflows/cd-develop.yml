name: "CD - Despliegue a Develop - onesiteapp_ex"
on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: "Security Gate (SAST + SCA)"
    uses: ./.github/workflows/security-scan.yml

  deploy-backend:
    name: "Build y Despliegue Backend (api-ex)"
    needs: security-scan
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: onesiteapp_ex-ms
    steps:
      - name: Checkout del Código Fuente
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: onesiteapp_ex-ms/package-lock.json
      - name: Instalar Dependencias
        run: npm ci
      - name: Ejecutar Build de NestJS
        run: npm run build
      - name: Copiar Artefactos al Directorio de Despliegue
        run: |
          mkdir -p /var/www/ProyectosFundea/api-ex
          rsync -av --delete \
            --exclude='.env' --exclude='.env.*' \
            dist/ package.json package-lock.json ecosystem.config.js \
            /var/www/ProyectosFundea/api-ex/
      - name: Instalar Dependencias de Producción
        working-directory: /var/www/ProyectosFundea/api-ex
        run: npm ci --omit=dev
      - name: Reiniciar Aplicación con PM2
        working-directory: /var/www/ProyectosFundea/api-ex
        run: |
          pm2 startOrRestart ecosystem.config.js --update-env
          pm2 save

  deploy-frontend:
    name: "Build y Despliegue Frontend (onesiteapp_ex)"
    needs: security-scan
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: onesiteapp_ex
    steps:
      - name: Checkout del Código Fuente
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: onesiteapp_ex/package-lock.json
      - name: Instalar Dependencias
        run: npm ci
      - name: Ejecutar Build del Frontend
        run: npm run build
      - name: Copiar Artefactos al Directorio de Despliegue
        run: |
          mkdir -p /var/www/ProyectosFundea/onesiteapp_ex
          rsync -av --delete build/ /var/www/ProyectosFundea/onesiteapp_ex/
